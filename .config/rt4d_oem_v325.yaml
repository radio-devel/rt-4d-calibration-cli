schema_version: 1
radio: iRadio RT-4D / DM-UV4R
firmware_generation: OEM V3.25 / CPS V2.06

transport:
  block_size: 0x400
  read_start: 0x000000
  read_size: 0x2000

sectors:
  - name: primary
    description: Primary, actively used main-MCU/BK4819 calibration sector
    offset: 0x000000
    size: 0x1000
  - name: mirror
    description: Firmware-maintained calibration backup sector
    offset: 0x001000
    size: 0x1000

selection:
  marker_field: validity_marker
  valid_value: 0x9A
  priority: [primary, mirror]
  fallback: compiled fallback

header:
  name: global_header
  label: Global calibration header
  description: Global BK4819, audio, VOX, and ADC settings
  offset: 0x0000
  size: 0x0020
  fields:
    - {name: validity_marker, label: Validity marker, description: "Only sector-validity byte checked by audited OEM V3.25 startup", offset: 0x00, type: u8, expected: 0x9A}
    - {name: unknown_header_01, label: Unknown header byte 0x01, description: "Purpose has not been established; preserved and reported without interpretation", offset: 0x01, type: u8}
    - {name: bk4819_reg_3e_preset, label: BK4819 REG_3E preset, description: "Little-endian preset written to BK4819 register 0x3E", offset: 0x02, type: u16le}
    - {name: audio_expander_parameters, label: Audio expander parameters, description: "Packed expander mode, AF, and noise parameters; subfields remain undecoded", offset: 0x04, type: u16le}
    - {name: audio_compressor_parameters, label: Audio compressor parameters, description: "Packed compressor mode, AF, and noise parameters; subfields remain undecoded", offset: 0x06, type: u16le}
    - {name: tx_300hz_response, label: TX 300 Hz response selection, description: "BK4819 transmit high-pass response coefficient selection", offset: 0x08, type: u8}
    - {name: tx_3khz_response, label: TX 3 kHz response selection, description: "BK4819 transmit low-pass response coefficient selection", offset: 0x09, type: u8}
    - {name: rx_300hz_response, label: RX 300 Hz response selection, description: "BK4819 receive high-pass response coefficient selection", offset: 0x0A, type: u8}
    - {name: rx_3khz_response, label: RX 3 kHz response selection, description: "BK4819 receive low-pass response coefficient selection", offset: 0x0B, type: u8}
    - {name: vox_on_threshold, label: VOX-on threshold, description: "Little-endian threshold used to assert VOX", offset: 0x0C, type: u16le}
    - {name: vox_off_threshold, label: VOX-off threshold, description: "Little-endian threshold used to release VOX", offset: 0x0E, type: u16le}
    - {name: battery_adc_points, label: Battery/ADC voltage calibration points, description: "Fifteen vendor calibration bytes displayed after scaling by 0.1", offset: 0x10, type: u8_array, count: 15, scale: 0.1, unit: V}
    - {name: adc_correction, label: ADC correction, description: "ADC correction byte stored with a +128 bias", offset: 0x1F, type: u8, bias: 128}

record_table:
  name: frequency_bands
  label: Frequency-band calibration records
  description: Fifteen fixed-size per-band BK4819 calibration records
  offset: 0x0020
  record_size: 0x70
  count: 15
  records:
    - {name: band_00, label: "136-174 MHz", oem_v3_25_selectable: true, normal_radio_band: true}
    - {name: band_01, label: "400-480 MHz", oem_v3_25_selectable: true, normal_radio_band: true}
    - {name: band_02, label: "18-64 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_03, label: "64-136 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_04, label: "174-240 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_05, label: "240-320 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_06, label: "320-400 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_07, label: "480-560 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_08, label: "560-640/660 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_09, label: "840-920 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_10, label: "920-1000 MHz", oem_v3_25_selectable: true, normal_radio_band: false}
    - {name: band_11, label: "1000-1080 MHz", oem_v3_25_selectable: false, normal_radio_band: false}
    - {name: band_12, label: "1080-1160 MHz", oem_v3_25_selectable: false, normal_radio_band: false}
    - {name: band_13, label: "1160-1240 MHz", oem_v3_25_selectable: false, normal_radio_band: false}
    - {name: band_14, label: "1240-1300 MHz", oem_v3_25_selectable: false, normal_radio_band: false}
  fields:
    - {name: frequency_correction, label: Frequency correction, description: "Unsigned little-endian value biased by 0x8000; OEM frequency units are 10 Hz", offset: 0x00, type: u16le, bias: 0x8000, scale: 10, unit: Hz}
    - {name: wide_microphone_gain, label: Wide-band microphone gain, description: "Nominal format byte; no audited V3.25 read found", offset: 0x02, type: u8}
    - {name: wide_tx_deviation, label: Wide-band TX deviation, description: "Complete word; usable deviation is in low 12 bits", offset: 0x03, type: u16le, mask: 0x0FFF}
    - {name: wide_ctcss_deviation, label: Wide-band CTCSS deviation, description: "Low 7 bits are used", offset: 0x05, type: u8, mask: 0x7F}
    - {name: wide_dcs_deviation, label: Wide-band DCS deviation, description: "Low 7 bits are used", offset: 0x06, type: u8, mask: 0x7F}
    - {name: wide_volume_gain_dac, label: Packed wide-band volume gain and DAC level, description: "Packed word; subfield allocation remains unproven", offset: 0x07, type: u16le}
    - {name: narrow_microphone_gain, label: Narrow-band microphone gain, description: "Nominal format byte; no audited V3.25 read found", offset: 0x09, type: u8}
    - {name: narrow_tx_deviation, label: Narrow-band TX deviation, description: "Complete word; usable deviation is in low 12 bits", offset: 0x0A, type: u16le, mask: 0x0FFF}
    - {name: narrow_ctcss_deviation, label: Narrow-band CTCSS deviation, description: "Low 7 bits are used", offset: 0x0C, type: u8, mask: 0x7F}
    - {name: narrow_dcs_deviation, label: Narrow-band DCS deviation, description: "Low 7 bits are used", offset: 0x0D, type: u8, mask: 0x7F}
    - {name: narrow_volume_gain_dac, label: Packed narrow-band volume gain and DAC level, description: "Packed word; subfield allocation remains unproven", offset: 0x0E, type: u16le}
    - {name: high_power_pa_bias, label: High-power PA-bias curve, description: "Sixteen nonlinear hardware control codes; not watts or ERP", offset: 0x10, type: u8_array, count: 16, element_mask: 0x3F}
    - {name: low_power_pa_bias, label: Low-power PA-bias curve, description: "Sixteen nonlinear hardware control codes; not watts or ERP", offset: 0x20, type: u8_array, count: 16, element_mask: 0x3F}
    - {name: wide_noise_thresholds, label: Wide-band noise thresholds, description: "Sixteen wide-band noise calibration thresholds", offset: 0x30, type: u8_array, count: 16}
    - {name: wide_rssi_squelch_thresholds, label: Wide-band RSSI/squelch thresholds, description: "Sixteen wide-band RSSI/squelch calibration thresholds", offset: 0x40, type: u8_array, count: 16}
    - {name: narrow_noise_thresholds, label: Narrow-band noise thresholds, description: "Sixteen narrow-band noise calibration thresholds", offset: 0x50, type: u8_array, count: 16}
    - {name: narrow_rssi_squelch_thresholds, label: Narrow-band RSSI/squelch thresholds, description: "Sixteen narrow-band RSSI/squelch calibration thresholds", offset: 0x60, type: u8_array, count: 16}

unknown_ranges:
  - {name: reserved_or_unknown_06b0_07ff, label: Undecoded tail before 0x0800, description: "Observed zero on three radios; not a format guarantee", offset: 0x06B0, size: 0x0150}
  - {name: reserved_or_unknown_0800_0fff, label: Undecoded upper half-sector, description: "Observed erased on three radios; not a format guarantee", offset: 0x0800, size: 0x0800}

notes:
  dmr_calibration: >-
    The separate 23-byte DMR/baseband calibration has no proven external-SPI
    address and is not included.
